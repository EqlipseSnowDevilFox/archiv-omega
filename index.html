<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARCHIV Ω</title>

<link
rel="stylesheet"
href="css/main.css">

</head>

<body>

<header>


<h1 id="omega">
    ARCHIV Ω
</h1>

<input
    id="search"
    placeholder="Suche...">


</header>

<div class="layout">


<aside id="sidebar">

    <div id="observerPanel">

        <h3>OBSERVER</h3>

        <div id="observerLevel">
            LEVEL 0
        </div>

        <div id="visitCount">
            BESUCHE: 0
        </div>

    </div>

    <div id="recordList"></div>

</aside>

<main>

    <div id="viewer">
        Archiv wird geladen...
    </div>

</main>


</div>

<div id="terminal">


<div id="terminalHeader">

    <span>TERMINAL Ω</span>

    <button id="closeTerminal">
        X
    </button>

</div>

<div id="terminalOutput"></div>

<input
    id="terminalInput"
    placeholder="Befehl eingeben...">


</div>

<script src="js/archive.js"></script>

<script src="js/search.js"></script>

<script src="js/terminal.js"></script>

<script src="js/observer.js"></script>

<script src="js/events.js"></script>

<script src="js/app.js"></script>

</body>
</html>
